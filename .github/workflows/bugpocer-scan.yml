  name: BugPoCer Security Scan

  on:
    pull_request:
      branches: [ main ]
    push:
      branches: [ main ]
    workflow_dispatch:  # Allow manual triggering

  permissions:
    security-events: write  # Required for Code Scanning upload
    contents: read
    pull-requests: write

  jobs:
    bugpocer-scan:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0  # Full history for better analysis

        - name: Install Foundry
          uses: foundry-rs/foundry-toolchain@v1

        - name: Run forge install
          run: forge install

        - name: Run BugPoCer (via Olympix integrated security)
          uses: olympix/integrated-security@main
          env:
            OLYMPIX_API_TOKEN: ${{ secrets.OLYMPIX_API_TOKEN }}

        - name: Upload SARIF to GitHub Code Scanning
          if: always()  # Upload even if previous step fails
          uses: github/codeql-action/upload-sarif@v3
          with:
            sarif_file: olympix.sarif
            category: bugpocer
