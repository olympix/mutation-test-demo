name: BugPocer Security Analysis Workflow
on:
  push:

jobs:
  bugpocer-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.OLYMPIX_GITHUB_ACCESS_TOKEN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run forge install
        run: |
          forge install

      - name: BugPocer Security Analysis
        uses: olympix/bugpocer-action@create_action
        env:
          OLYMPIX_API_TOKEN: ${{ secrets.OLYMPIX_API_TOKEN }}
          OLYMPIX_GITHUB_COMMIT_HEAD_SHA: ${{ github.sha }}
        with:
          args: -w . -env -p src/ReentrancyAttack.sol -p src/SavingsAccount.sol
